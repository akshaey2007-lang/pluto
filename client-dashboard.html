<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client workspace — Pluto</title>
<meta name="description" content="Your Pluto client account and workspace.">
<link rel="icon" href="assets/pluto-logo-transparent.png" type="image/png">
<link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="signal-desk.css"><link rel="stylesheet" href="account.css">
</head>
<body class="workspace-page" data-workspace="client">
<a class="account-skip" href="#account-main">Skip to workspace</a>
<div class="workspace-shell">
<aside class="workspace-sidebar" id="workspace-sidebar" aria-label="Client workspace menu">
<a class="workspace-logo" href="index.html" aria-label="Pluto home"><img src="assets/pluto-logo-transparent.png" alt="Pluto"></a>
<div class="workspace-role"><span>Client workspace</span><span id="account-state">Account</span></div>
<nav class="workspace-menu"><button class="workspace-nav-button" type="button" data-view="overview"><span>Overview</span></button><button class="workspace-nav-button" type="button" data-view="projects"><span>Projects</span></button><button class="workspace-nav-button" type="button" data-view="matches"><span>Talent matches</span></button><button class="workspace-nav-button" type="button" data-view="proposals"><span>Proposals</span></button><button class="workspace-nav-button" type="button" data-view="work"><span>Active work</span></button><button class="workspace-nav-button" type="button" data-view="messages"><span>Messages</span></button><button class="workspace-nav-button" type="button" data-view="payments"><span>Payments</span></button><button class="workspace-nav-button" type="button" data-view="profile"><span>My profile</span></button><button class="workspace-nav-button" type="button" data-view="settings"><span>Settings</span></button></nav>
<div class="workspace-profile"><div class="profile-avatar-small" id="account-avatar">P</div><div><b id="account-name">Loading account…</b><span id="account-role">Client</span></div><button class="row-button" type="button" data-signout>Exit</button></div>
</aside>
<div class="workspace-content">
<header class="workspace-topbar"><button class="mobile-sidebar-toggle" type="button" aria-label="Open menu" aria-controls="workspace-sidebar" aria-expanded="false">Menu</button><span class="topbar-context">Your client workspace</span><a class="secondary-action" href="index.html">Platform home</a></header>
<main class="workspace-main" id="account-main" tabindex="-1"><p role="status">Loading your profile…</p></main>
</div></div>
<div class="workspace-toast" role="status" aria-live="polite"></div>
<script type="module" src="account.mjs"></script>
</body></html>
